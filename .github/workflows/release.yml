name: Release binary

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Match tag to Cargo package version
        run: |
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "v${package_version}" = "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: nbork
            install_musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: nbork
            install_musl: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: nbork
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: nbork
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: nbork.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.install_musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "staging/nbork-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "staging/nbork-${{ matrix.target }}/${{ matrix.binary }}"
      - uses: actions/upload-artifact@v7
        with:
          name: nbork-${{ matrix.target }}
          path: staging/nbork-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: binaries
      - name: Package and checksum binaries
        run: |
          mkdir release
          for directory in binaries/nbork-*; do
            target=${directory#binaries/nbork-}
            if [ -f "$directory/nbork.exe" ]; then
              archive="nbork-${target}.zip"
              (cd "$directory" && zip -q "$OLDPWD/release/$archive" nbork.exe)
            else
              archive="nbork-${target}.tar.gz"
              tar -C "$directory" -czf "release/$archive" nbork
            fi
            (cd release && sha256sum "$archive" > "$archive.sha256")
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
